<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sycapt CHAT AI</title>
  <link rel="icon" href="/iconweb.ico" type="image/x-icon">

  <!-- Google Fonts: Inter for UI, JetBrains Mono for Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'IBM Plex Sans', 'Sarabun', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            display: ['IBM Plex Sans', 'Inter', 'sans-serif'],
          },
          colors: {
            zinc: {
              850: '#1f1f22',
              900: '#18181b',
              950: '#09090b',
            },
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              200: '#fecdd3',
              300: '#fda4af',
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
              800: '#9f1239',
              900: '#881337',
              950: '#4c0519',
            }
          },
          typography: (theme) => ({
            DEFAULT: {
              css: {
                color: theme('colors.zinc.700'),
                a: {
                  color: theme('colors.brand.600'),
                  '&:hover': {
                    color: theme('colors.brand.700'),
                  },
                },
              },
            },
            dark: {
              css: {
                color: theme('colors.zinc.300'),
                a: {
                  color: theme('colors.brand.400'),
                  '&:hover': {
                    color: theme('colors.brand.300'),
                  },
                },
              },
            },
          }),
        }
      },
      plugins: []
    }
  </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "zustand": "https://esm.sh/zustand@4.5.2?external=react",
    "framer-motion": "https://esm.sh/framer-motion@10.16.4?external=react,react-dom",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  <style>
    /* Global Font Settings */
    body {
      font-family: 'Inter', 'IBM Plex Sans', 'Sarabun', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    code,
    pre {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Custom Scrollbar for a cleaner look */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      /* zinc-700 */
      border: 2px solid #09090b;
      /* zinc-950 */
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #52525b;
      /* zinc-600 */
    }
  </style>
  <link rel="stylesheet" href="/src/app/index.css">
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-zinc-950 dark:text-gray-100 transition-colors duration-200">
  <div id="root"></div>

  <script type="module" src="/src/app/index.tsx"></script>
</body>

</html>
